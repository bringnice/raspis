<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РУП9-26БП — расписание</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--mut:#6b7280;--acc:#2563eb;--bad:#dc2626;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#1e1f22;--mut:#9ca3af;--acc:#60a5fa;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding:12px}
header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
header h1{flex:1;font-size:18px;margin:0;text-align:center}
button{background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:10px 14px;font-size:16px}
#today{display:block;margin:0 auto 10px;color:var(--acc);background:none;padding:4px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.l{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.n{font-weight:700;color:var(--acc);width:14px}
.b{flex:1}.t{color:var(--mut);font-size:13px}
.r{font-weight:600;white-space:nowrap}
.x .s{text-decoration:line-through;color:var(--mut)}.x .r{color:var(--bad)}
.tag{font-size:12px;font-weight:600}.cx{color:var(--bad)}.rp{color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<header>
  <button id="prev">←</button><h1 id="title"></h1><button id="next">→</button>
</header>
<button id="today">Сегодня</button>
<div class="sub" id="sub"></div>
<div id="list"></div>
<script>
const DAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let data={days:{}},cur=new Date();

async function load(){
  try{data=await (await fetch('schedule.json?'+Date.now())).json()}catch(e){}
  render();
}
function render(){
  const k=iso(cur),day=data.days[k];
  document.getElementById('title').textContent=DAYS[cur.getDay()]+', '+cur.toLocaleDateString('ru',{day:'numeric',month:'long'});
  let sub=day?day.week:'';
  if(data.updated)sub+=(sub?' · ':'')+'обновлено '+new Date(data.updated).toLocaleString('ru',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('sub').textContent=sub;
  const el=document.getElementById('list');
  if(!day||(!day.lessons.length&&!day.note)){el.innerHTML='<div class="empty">'+(day?'Занятий нет':'Для этой даты расписания пока нет')+'</div>';return}
  if(day.note&&!day.lessons.length){el.innerHTML='<div class="empty">'+esc(day.note)+'</div>';return}
  el.innerHTML=day.lessons.map(l=>`
    <div class="l ${l.cancelled?'x':''}">
      <div class="n">${l.n}</div>
      <div class="b"><div class="s">${esc(l.subject)}</div>
        <div class="t">${l.time} · ${esc(l.teacher)}${l.note?' · '+esc(l.note):''}</div>
        ${l.cancelled?'<div class="tag cx">ОТМЕНА</div>':''}${l.replacement?'<div class="tag rp">ЗАМЕНА</div>':''}</div>
      <div class="r">${esc(l.room||'')}</div>
    </div>`).join('');
}
const go=n=>{cur.setDate(cur.getDate()+n);render()};
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
today.onclick=()=>{cur=new Date();render()};
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
